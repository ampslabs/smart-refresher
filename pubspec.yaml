name: smart_refresher
description: A powerful Flutter widget providing pull-to-refresh and infinite loading for scrollable content.
version: 1.2.0
homepage: https://github.com/ampslabs/smart-refresher
repository: https://github.com/ampslabs/smart-refresher
issue_tracker: https://github.com/ampslabs/smart-refresher/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  cupertino_ui: ^1.0.2
  flutter:
    sdk: flutter
  material_ui: ^1.1.1

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
